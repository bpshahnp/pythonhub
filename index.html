<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Code Snippets</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Pyodide Python Interpreter -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>.py HUB</h1>
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Global Loading Banner for Pyodide -->
    <div id="pyodide-loader" class="loader-banner">
        Downloading Python Environment (this may take a moment)...
    </div>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <h3>Categories</h3>
            <ul id="category-list">
                <li><button class="category-btn active" data-category="all">All Snippets</button></li>
                <li><button class="category-btn" data-category="basics">Basics</button></li>
                <li><button class="category-btn" data-category="data-structures">Data Structures</button></li>
                <li><button class="category-btn" data-category="algorithms">Algorithms</button></li>
            </ul>
        </aside>

        <main class="content">
            <h2 id="current-category">All Snippets</h2>
            <div id="snippet-container"></div>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>
    <script src="script.js"></script>
</body>
</html>
